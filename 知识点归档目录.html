<style>
:root{
  --paper:#F5F7F3;
  --ink:#1C2B24;
  --deep:#16382C;
  --deep2:#1E4636;
  --accent:#2D6A4F;
  --accent-soft:#DCE8DE;
  --line:#D6DED6;
  --muted:#5C6E64;
  --chip:#E9F0E9;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Sans SC",system-ui,"Microsoft YaHei",sans-serif;
  background:var(--paper);color:var(--ink);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
/* ===== hero ===== */
.hero{
  background:linear-gradient(160deg,var(--deep) 0%,var(--deep2) 100%);
  color:#EAF1EB;padding:56px 24px 44px;
  border-bottom:1px solid #0F2A20;
}
.hero-inner{max-width:1080px;margin:0 auto}
.kicker{
  font-size:12px;letter-spacing:.18em;color:#9FC0AE;
  margin-bottom:14px;font-weight:500;
}
h1{
  font-family:"Noto Serif SC",serif;
  font-size:clamp(30px,4.6vw,46px);font-weight:900;
  line-height:1.18;letter-spacing:.02em;
}
.lede{margin-top:12px;color:#C8D9CE;font-weight:300;font-size:15px}
.stats{
  display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;
}
.stat{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  border-radius:8px;padding:10px 16px;
}
.stat b{display:block;font-family:"Noto Serif SC",serif;font-size:20px;font-weight:700;color:#fff}
.stat span{font-size:12px;color:#A9C4B5}
.search{
  margin-top:24px;max-width:560px;position:relative;
}
.search svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;stroke:#7E9488;fill:none;stroke-width:2;
}
#q{
  width:100%;padding:13px 16px 13px 42px;
  border:1px solid rgba(255,255,255,.22);border-radius:8px;
  background:rgba(255,255,255,.10);color:#fff;
  font-size:15px;font-family:inherit;outline:none;
}
#q::placeholder{color:#9FB8AA}
#q:focus{border-color:#7FC39A;background:rgba(255,255,255,.16)}
.search-hint{font-size:12px;color:#9FB8AA;margin-top:8px;min-height:18px}
/* ===== main ===== */
main{max-width:1080px;margin:0 auto;padding:36px 24px 60px}
.pack{margin-bottom:48px}
.pack-head{
  display:flex;align-items:baseline;gap:16px;
  padding-bottom:14px;border-bottom:2px solid var(--deep);
  margin-bottom:18px;
}
.pack-no{
  font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;
  color:var(--accent);flex:none;
}
.pack-meta h2{font-size:20px;font-weight:700;letter-spacing:.01em}
.pack-meta p{font-size:13px;color:var(--muted);margin-top:2px}
/* 学科卡片 */
.subjects{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.subject{
  background:#fff;border:1px solid var(--line);
  border-radius:8px;overflow:hidden;
}
.subject-head{
  width:100%;display:flex;align-items:center;gap:10px;
  background:none;border:none;cursor:pointer;
  padding:12px 14px;text-align:left;font-family:inherit;
  color:var(--ink);
}
.subject-head:hover{background:var(--chip)}
.s-name{font-size:15px;font-weight:700;flex:none}
.s-meta{margin-left:auto;font-size:12px;color:var(--muted);flex:none}
.chev{
  width:13px;height:13px;flex:none;stroke:var(--muted);
  fill:none;stroke-width:2;transition:transform .18s ease;
}
.subject.open .chev{transform:rotate(90deg)}
.files{list-style:none;border-top:1px solid var(--line);display:none}
.subject.open .files{display:block}
.file{
  display:flex;align-items:baseline;gap:12px;
  padding:8px 14px;font-size:13.5px;
  border-top:1px solid #EEF2EE;
}
.file:first-child{border-top:none}
.file:hover{background:#F4F8F3}
.f-name{color:var(--ink);word-break:break-all}
.f-size{margin-left:auto;color:var(--muted);font-size:12px;flex:none}
/* 搜索态 */
.subjects.filtering .subject.hidden,.pack.hidden{display:none}
.file.hidden{display:none}
.empty-note{display:none;color:var(--muted);font-size:13px;padding:16px 4px}
body.searching .empty-note{display:block}
/* footer */
footer{
  max-width:1080px;margin:0 auto;padding:22px 24px 40px;
  color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);
}
/* ===== 响应式 ===== */
@media (max-width:760px){
  .hero{padding:40px 18px 34px}
  main{padding:26px 16px 44px}
  .subjects{grid-template-columns:1fr}
  .pack-no{font-size:22px}
  .pack-meta h2{font-size:17px}
  .stat b{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .chev{transition:none}
}
</style>
</head>

function fmtMB(b){

      '<span class="pack-no">0' + (i+1) + '</span>' +
      '<div class="pack-meta"><h2>' + esc(p.file) + '</h2>' +
      '<p>' + p.count + ' 个文件 · ' + fmtMB(p.size) + ' · ' + p.subjects.length + ' 个学科</p></div>' +
    '</div>' +
    '<div class="subjects">' +
    p.subjects.map(s =>
      '<div class="subject open" data-subj="' + esc(s.name) + '">' +
        '<button class="subject-head" type="button" aria-expanded="true">' +
          '<span class="s-name">' + esc(s.name) + '</span>' +
          '<span class="s-meta">' + s.count + ' 个 · ' + fmtMB(s.size) + '</span>' + CHEV +
        '</button>' +
        '<ul class="files">' +
        s.files.map(f =>
          '<li class="file" data-search="' + esc((s.name + ' ' + f.name).toLowerCase()) + '">' +
            '<span class="f-name">' + esc(f.name) + '</span>' +
            '<span class="f-size">' + fmtMB(f.size) + '</span>' +
          '</li>').join('') +
        '</ul>' +
      '</div>').join('') +
    '</div>';
  main.appendChild(sec);
});

// 折叠
document.addEventListener('click', e => {
  const head = e.target.closest('.subject-head');
  if (!head) return;
  const subj = head.closest('.subject');
  const open = subj.classList.toggle('open');
  head.setAttribute('aria-expanded', open ? 'true' : 'false');
});

// 搜索
const q = document.getElementById('q');
const hint = document.getElementById('hint');
let lastQuery = '';
function applyFilter(){
  const t = q.value.trim().toLowerCase();
  document.body.classList.toggle('searching', !!t);
  const subjGrids = main.querySelectorAll('.subjects');
  let match = 0;
  subjGrids.forEach(grid => {
    grid.classList.toggle('filtering', !!t);
    let visibleInGrid = 0;
    grid.querySelectorAll('.subject').forEach(s => {
      let vis = 0;
      s.querySelectorAll('.file').forEach(f => {
        const ok = !t || f.dataset.search.includes(t);
        f.classList.toggle('hidden', !ok);
        if (ok) vis++;
      });
      const show = !t || vis > 0;
      s.classList.toggle('hidden', !show);
      if (show) visibleInGrid++;
    });
    const pack = grid.closest('.pack');
    pack.classList.toggle('hidden', !!t && visibleInGrid === 0);
    match += visibleInGrid;
  });
  if (t) {
    hint.textContent = '找到 ' + match + ' 个学科包含「' + q.value.trim() + '」';
    hint.style.visibility = 'visible';
  } else {
    hint.textContent = '';
  }
}
q.addEventListener('input', applyFilter);
applyFilter();
</script>
</body>
